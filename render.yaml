services:
  - type: web
    name: banco-kike-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run api:build
    startCommand: npm --workspace api run start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_ORIGIN
        value: https://banco-kike-api.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
